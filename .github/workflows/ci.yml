name: CI Backend

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, test, preprod, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test --if-present

      - name: Build Docker image
        run: docker build -t backend-${{ github.ref_name }} .

      - name: Notify Slack Success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"text\": \"🚀 *CI EXITOSO*\n
            Repo: *${{ github.repository }}*\n
            Rama: *${{ github.ref_name }}*\n
            Autor: *${{ github.actor }}*\n
            Commit: _${{ github.event.head_commit.message }}_\n
            Nada explotó 💥❌\"
          }" \
          $SLACK_WEBHOOK_URL

      - name: Notify Slack Failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"text\": \"🔥 *CI FALLÓ*\n
            Repo: *${{ github.repository }}*\n
            Rama: *${{ github.ref_name }}*\n
            Autor: *${{ github.actor }}*\n
            El CI murió en combate ⚔️\n
            Revisa logs antes de que alguien pregunte 😅\"
          }" \
          $SLACK_WEBHOOK_URL
